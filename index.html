
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff0f5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>💕 ふたりのホンネ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #fff0f5, #ffe1eb);
  font-family: -apple-system, BlinkMacSystemFont,
    "Helvetica Neue", sans-serif;
  color: #49343d;
}

main {
  width: 100%;
  max-width: 430px;
  padding: 32px 24px;
  background: white;
  border-radius: 28px;
  text-align: center;
  box-shadow: 0 14px 38px #cf739333;
}

.logo {
  font-size: 48px;
  margin-bottom: 10px;
}

h1 {
  margin: 8px 0;
  font-size: 28px;
  color: #db6085;
}

.subtitle {
  color: #866b76;
  line-height: 1.8;
}

button {
  width: 100%;
  padding: 16px;
  border: none;
  border-radius: 15px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.google {
  margin-top: 22px;
  background: #fff;
  border: 1px solid #dedede;
  color: #333;
  box-shadow: 0 3px 9px #00000010;
}

.google:disabled {
  opacity: 0.5;
}

.logout {
  margin-top: 20px;
  background: #ffe1eb;
  color: #a83d60;
}

.hidden {
  display: none !important;
}

.profile {
  margin: 20px 0;
  padding: 18px;
  background: #fff5f8;
  border-radius: 18px;
}

.avatar {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  background: #f4d9e2;
}

.name {
  margin: 12px 0 4px;
  font-size: 18px;
  font-weight: bold;
}

.email {
  font-size: 13px;
  color: #907b84;
  overflow-wrap: anywhere;
}

.status {
  margin-top: 20px;
  font-size: 13px;
  color: #947d86;
}

#error {
  margin-top: 12px;
  color: #b82e54;
  font-size: 14px;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>
<main>

  <div class="logo">💕</div>

  <h1>ふたりのホンネ</h1>

  <p class="subtitle">
    ふたりの気持ちを、YES・NOで。<br>
    ふたりだけの小さな質問アプリ ♡
  </p>

  <section id="loginScreen" class="hidden">
    <button id="googleLogin" class="google">
      Googleでログイン ♡
    </button>
  </section>

  <section id="userScreen" class="hidden">
    <div class="profile">
      <img id="avatar" class="avatar"
           alt="プロフィール画像">
      <div id="displayName" class="name"></div>
      <div id="email" class="email"></div>
    </div>

    <p>
      Googleログイン成功！ ♡
    </p>

    <p class="subtitle">
      次は、ふたり専用の質問画面を作るよ。
    </p>

    <button id="logout" class="logout">
      ログアウト
    </button>
  </section>

  <p id="status" class="status">
    ログイン状態を確認しています…
  </p>

  <p id="error" role="alert"></p>

</main>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged,
  signOut
} from
"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBpGIfu3jOksMS8_jPAUPXHuh4GzgwyUq8",
  authDomain: "futari-no-honne.firebaseapp.com",
  projectId: "futari-no-honne",
  storageBucket: "futari-no-honne.firebasestorage.app",
  messagingSenderId: "512221931738",
  appId: "1:512221931738:web:e69b8fd62b46c6eaa69de3"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

provider.setCustomParameters({
  prompt: "select_account"
});

const $ = id => document.getElementById(id);

function show(id, visible) {
  $(id).classList.toggle("hidden", !visible);
}

function setStatus(message) {
  $("status").textContent = message;
}

function showError(error) {
  console.error(error);

  const messages = {
    "auth/popup-blocked":
      "ログイン画面がブロックされました。Safariで開いてね。",
    "auth/popup-closed-by-user":
      "ログインがキャンセルされました。",
    "auth/unauthorized-domain":
      "GitHub PagesのドメインをFirebaseに登録してね。",
    "auth/operation-not-allowed":
      "FirebaseでGoogleログインを有効にしてね。",
    "auth/network-request-failed":
      "通信エラーです。ネット接続を確認してね。"
  };

  $("error").textContent =
    messages[error.code] ||
    error.message ||
    "ログインでエラーが発生しました。";
}

function renderUser(user) {
  const loggedIn = !!user;

  show("loginScreen", !loggedIn);
  show("userScreen", loggedIn);

  if (!loggedIn) {
    setStatus("Googleアカウントでログインしてね ♡");
    return;
  }

  $("displayName").textContent =
    user.displayName || "ユーザー";

  $("email").textContent =
    user.email || "";

  const avatar = $("avatar");

  if (user.photoURL) {
    avatar.src = user.photoURL;
    avatar.style.display = "inline-block";
  } else {
    avatar.removeAttribute("src");
    avatar.style.display = "none";
  }

  setStatus("ログイン中 ♡");
}

$("googleLogin").addEventListener("click", async () => {
  $("error").textContent = "";
  $("googleLogin").disabled = true;
  setStatus("Googleログインを開始しています…");

  try {
    await signInWithPopup(auth, provider);
  } catch (error) {
    showError(error);
    setStatus("ログインできませんでした");
  } finally {
    $("googleLogin").disabled = false;
  }
});

$("logout").addEventListener("click", async () => {
  $("error").textContent = "";

  try {
    await signOut(auth);
  } catch (error) {
    showError(error);
  }
});

onAuthStateChanged(
  auth,
  user => renderUser(user),
  error => showError(error)
);

</script>
</body>
</html>
